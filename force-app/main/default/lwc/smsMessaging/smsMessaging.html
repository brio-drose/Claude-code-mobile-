<template>
    <div class="sms-panel">

        <!-- Header -->
        <header class="sms-panel-header">
            <div class="sms-header-left">
                <lightning-icon icon-name="utility:sms" size="small" class="sms-header-icon"></lightning-icon>
                <div>
                    <h2 class="sms-panel-title">SMS Conversation</h2>
                    <p class="sms-contact-name">{contactDisplayName}</p>
                </div>
            </div>
            <div class="sms-header-right">
                <template if:true={showToggle}>
                    <lightning-input
                        type="toggle"
                        label="All account messages"
                        name="showAll"
                        checked={showAllMessages}
                        onchange={handleToggle}
                        class="sms-toggle"
                        message-toggle-active=""
                        message-toggle-inactive=""
                    ></lightning-input>
                </template>
                <lightning-button-icon
                    icon-name="utility:refresh"
                    variant="bare-inverse"
                    alternative-text="Refresh"
                    title="Refresh messages"
                    onclick={loadMessages}
                    disabled={isLoading}
                ></lightning-button-icon>
            </div>
        </header>

        <!-- Show-all info bar -->
        <template if:true={showAllMessages}>
            <div class="sms-info-bar">
                <lightning-icon icon-name="utility:info" size="xx-small" class="sms-info-icon"></lightning-icon>
                <span>Showing all messages for this account &mdash;
                    <strong>highlighted messages belong to other records</strong>
                </span>
            </div>
        </template>

        <!-- Message thread -->
        <div class="sms-thread" lwc:ref="messageContainer">

            <template if:true={isLoading}>
                <div class="sms-spinner-wrap">
                    <lightning-spinner alternative-text="Loading messages" size="medium"></lightning-spinner>
                </div>
            </template>

            <template if:true={hasError}>
                <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                    <lightning-icon icon-name="utility:error" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                    {errorMessage}
                </div>
            </template>

            <template if:false={hasMessages}>
                <template if:false={isLoading}>
                    <div class="sms-empty-state">
                        <lightning-icon icon-name="utility:chat" size="large" class="sms-empty-icon"></lightning-icon>
                        <p class="sms-empty-text">No messages yet. Start the conversation below.</p>
                    </div>
                </template>
            </template>

            <template if:true={hasMessages}>
                <ul class="sms-message-list">
                    <template for:each={messages} for:item="msg">
                        <li key={msg.id} class={msg.bubbleClass}>

                            <!-- Cross-record badge (shown above bubble) -->
                            <template if:true={msg.isCrossRecord}>
                                <div class="sms-cross-badge">
                                    <lightning-icon
                                        icon-name="utility:record_alt"
                                        size="xx-small"
                                        class="sms-cross-badge-icon"
                                    ></lightning-icon>
                                    <span>{msg.relatedRecordName}</span>
                                </div>
                            </template>

                            <div class="sms-bubble">
                                <p class="sms-bubble-body">{msg.body}</p>
                                <div class="sms-bubble-meta">
                                    <span class="sms-bubble-time">{msg.formattedDate}</span>
                                    <template if:true={msg.isOutbound}>
                                        <lightning-icon
                                            icon-name={msg.statusIcon}
                                            size="xx-small"
                                            class={msg.statusClass}
                                            title={msg.status}
                                        ></lightning-icon>
                                    </template>
                                </div>
                            </div>

                            <template if:true={msg.isInbound}>
                                <span class="sms-sender-label">{msg.fromDisplay}</span>
                            </template>

                        </li>
                    </template>
                </ul>
            </template>
        </div>

        <!-- Compose footer -->
        <footer class="sms-compose-footer">
            <div class="sms-compose-area">
                <lightning-textarea
                    name="messageBody"
                    placeholder="Type a message…"
                    value={newMessageBody}
                    onchange={handleMessageInput}
                    onkeydown={handleKeyDown}
                    max-length="1600"
                    label="Message"
                    variant="label-hidden"
                    disabled={isSending}
                    class="sms-compose-input"
                ></lightning-textarea>
                <div class="sms-compose-actions">
                    <span class="sms-char-count">{charCountDisplay}</span>
                    <lightning-button-icon
                        icon-name="utility:send"
                        variant="brand"
                        size="medium"
                        alternative-text="Send message"
                        title="Send (Ctrl+Enter)"
                        onclick={sendMessage}
                        disabled={isSendDisabled}
                        class="sms-send-btn"
                    ></lightning-button-icon>
                </div>
            </div>
            <template if:true={sendError}>
                <p class="sms-send-error">{sendError}</p>
            </template>
        </footer>

    </div>
</template>
